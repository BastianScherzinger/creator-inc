<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 432 432">
  <!--
    App-Symbol fuer HELLO WORLD.

    WARUM EIN PROMPT UND KEINE FIGUR:
    Jedes zweite Idle-Game im Store zeigt eine runde Comicfigur vor bunter
    Flaeche. Auf einer Kachel von 48 Pixeln sehen sie alle gleich aus. Ein
    Prompt mit Cursor ist im Store einmalig, bei jeder Groesse lesbar -- und
    die Zielgruppe erkennt ihn sofort. Es ist zugleich der Titel in Zeichen:
    Das Spiel beginnt mit den zwei Woertern, mit denen jeder anfaengt.

    DER WINKEL IST EIN PFAD, KEINE ZWEI GEDREHTEN RECHTECKE.
    Erster Anlauf: zwei Balken, um dieselbe Mitte gegeneinander gedreht. Beide
    drehten sich um denselben Punkt und ergaben ein X statt eines Winkels --
    im Bild sofort sichtbar, in den Zahlen nicht. Ein Pfad mit runden Enden
    beschreibt die Form direkt, statt sie aus Teilen zusammenzudrehen.

    GESTALTUNG FUER KLEINE GROESSEN:
    - Zwei Formen plus Hintergrund. Alles Weitere verschwindet bei 48 px.
    - Der Cursor ist das hellste Element und sitzt in der optischen Mitte.
    - Kein Farbverlauf, keine Kontur, kein Schatten: Play skaliert selbst,
      und feine Kanten werden dabei zu Matsch.
    - Android beschneidet adaptive Symbole auf einen Kreis; alles Wesentliche
      liegt innerhalb der mittleren 66 Prozent.
  -->

  <rect width="432" height="432" fill="#1A1E27"/>

  <path d="M 138 150 L 210 216 L 138 282"
        fill="none" stroke="#8E97A8" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="248" y="150" width="72" height="132" rx="8" fill="#F2A93B"/>
</svg>
